name: Client crypto

# Runs on every push to any branch that touches the crypto package, the E2EE contract it implements, or this workflow,
# and can be started by hand from the Actions tab ("Run workflow").
on:
  push:
    paths:
      - 'packages/client-crypto/**'
      - 'docs/e2ee/api.md'
      - 'packages/client/src/**'
      - 'app/api/v1/**'
      - 'lib/e2ee/**'
      - 'scripts/migrate.ts'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/crypto.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The package's own tooling (vitest 5, tsup) needs Node >= 20, so the unit tests run on 20, 22 and 24.
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck:crypto
      - name: Tests
        run: npm run test:crypto
      - name: Build
        run: npm run build:crypto

  # Independent implementations (libsodium, OpenSSL, reference Argon2) must agree with our frozen vectors.
  crosscheck:
    name: Cross-check vectors (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pynacl cryptography argon2-cffi
      - run: node packages/client-crypto/scripts/crosscheck.mjs

  # The same vectors, and every flow, in a real browser.
  browser:
    name: Playground in headless Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:playground -w @messaging-express/client-crypto
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node packages/client-crypto/scripts/playground-test.mjs

  pack:
    name: Pack the tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:crypto
      - name: Pack
        run: |
          mkdir -p artifacts
          npm pack -w @messaging-express/client-crypto --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-tarball
          path: artifacts/*.tgz
          if-no-files-found: error

  # What a customer experiences: the PACKED package installed into a fresh project, on every Node we claim to support.
  # No repo install here on purpose: only the tarball and the smoke script.
  consumer:
    name: Consumer smoke (Node ${{ matrix.node }})
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packages/client-crypto/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: crypto-tarball
          path: artifacts
      - name: Install into a fresh project and load it (ESM + CJS, including the IndexedDB subpath)
        run: node packages/client-crypto/scripts/smoke-pack.mjs --tarball "$(ls artifacts/*.tgz)"

  # The package against the REAL server and a real Postgres: lifecycle, malicious-server tampering, and mock-vs-real contract parity.
  integration:
    name: Real server (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mx
          POSTGRES_PASSWORD: mx
          POSTGRES_DB: mx
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mx:mx@localhost:5432/mx
      E2EE_ENABLED: 'on'
      REALTIME_PROVIDER: none
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Random JWT secret for this run
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$JWT_SECRET"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
      - name: Migrate and seed the database
        run: |
          npm run db:migrate
          psql "$DATABASE_URL" -f scripts/smoke-seed.sql
      - name: Build the SDK and the crypto package
        run: |
          npm run build:sdk
          npm run build:crypto
      - name: Start the server and wait until it is healthy
        run: |
          nohup npx tsx server.ts --dev > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "$BASE_URL/api/health" >/dev/null; then echo "healthy after ~$((i*2))s"; exit 0; fi
            sleep 2
          done
          echo "server did not become healthy"; tail -80 server.log; exit 1
      - name: Verify (lifecycle, malicious server, mock vs real)
        run: node packages/client-crypto/scripts/verify-crypto.mjs
      - name: Publish gate, dry run (everything except version, changelog and tag)
        run: node packages/client-crypto/scripts/check-release.mjs --dry
      - name: Server log if something failed
        if: failure()
        run: tail -150 server.log
