# Usage (always pass the env file):
#   Dev (recommended): Postgres + Redis in Docker, app on your machine
#     docker compose --env-file .env.docker up -d db redis
#     npm run db:migrate        # DATABASE_URL=postgres://mx:mx@localhost:5432/mx
#     npm run dev:socket
#   Prod-like: everything in Docker
#     docker compose --env-file .env.docker --profile app up --build -d
#     docker compose --env-file .env.docker --profile tools run --rm migrate
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mx}
      POSTGRES_DB: mx
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mx -d mx"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://mx:${POSTGRES_PASSWORD:-mx}@db:5432/mx
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.docker}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      REALTIME_PROVIDER: ${REALTIME_PROVIDER:-socketio}
      REDIS_URL: redis://redis:6379
      MAX_JSON_BODY_BYTES: ${MAX_JSON_BODY_BYTES:-262144}
      RATE_LIMIT_MODE: ${RATE_LIMIT_MODE:-off}
      WEBHOOK_DISPATCH: ${WEBHOOK_DISPATCH:-off}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes: [uploads:/app/.uploads]
    stop_grace_period: 15s   # > SHUTDOWN_TIMEOUT_MS (10 s) so graceful shutdown can finish
    restart: unless-stopped

  # One-off: run with --profile tools. Uses the build stage (has tsx + scripts/).
  migrate:
    profiles: ["tools"]
    build: { context: ., target: build }
    command: npm run db:migrate
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://mx:${POSTGRES_PASSWORD:-mx}@db:5432/mx

volumes:
  pgdata:
  uploads:
